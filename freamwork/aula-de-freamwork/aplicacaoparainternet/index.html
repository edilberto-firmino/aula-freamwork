<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Usuário</title>

    <link rel="stylesheet" href="qualquecoisa.css">
</head>
<body>

    <div class="container">

        <h1>Cadastro</h1>
        <p>Preencha os dados abaixo</p>

        <form id="formCadastro">

            <label for="nome">Nome</label>
            <input type="text" id="nome" placeholder="Digite seu nome">

            <label for="idade">Idade</label>
            <input type="text" id="idade" placeholder="Digite sua idade">

            <label for="contato">Contato</label>
            <input type="number" id="contato" placeholder="Digite seu contato">

            
            <label for="pai">Pai</label>
            <input type="number" id="pai" placeholder="Digite o contato do pai">

            
            <label for="mae">Mãe</label>
            <input type="number" id="mae" placeholder="Digite o contato da mãe">

            <label for="endereco">Endereço</label>
            <input type="text" id="endereco" placeholder="Digite seu endereço">


            <label for="email">E-mail</label>
            <input type="email" id="email" placeholder="Digite seu e-mail">

            <label for="senha">Senha</label>
            <input type="password" id="senha" placeholder="Digite sua senha">

            <label for="confirmarSenha">Confirmar senha</label>
            <input type="password" id="confirmarSenha" placeholder="Confirme sua senha">

            <button type="submit">Cadastrar</button>

            <p id="mensagem"></p>

        </form>

    </div>

    <script src="maisoumenos.js"></script>

</body>
</html>
